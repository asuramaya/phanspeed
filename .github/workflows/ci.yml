name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The family's shared CI core (sutra.mk's sibling layer -- see
  # docs/BOOTSTRAP.md in the sutra repo). Pinned to a commit SHA, not @main
  # and not a tag, per pill-ci.yml's own header: sutra cuts no tagged
  # release yet, and a floating @main ref would move every adopting pill's
  # CI the instant this file changes, with no per-pill review step.
  shared:
    uses: asuramaya/sutra/.github/workflows/pill-ci.yml@149b553b75467813748165401706ce6b50ca44d6
    with:
      python-files: "src/bin/phanspeedd src/bin/phanspeed src/bin/phanspeed-tune src/bin/phanspeed-update src/bin/phanspeed-healthcheck src/share/phanspeed/lib/sutra.py src/share/phanspeed/lib/sutra_update.py src/share/phanspeed/lib/sutra_xen.py tests/diag.py"
      shell-files: "install.sh uninstall.sh"
      shellcheck-files: "install.sh uninstall.sh packaging/make-extension-zip.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm packaging/activate-uuid-migration.sh"
      has-extension: true
      extension-js: "src/extension/phanspeed@asuramaya/extension.js"
      extension-metadata: "src/extension/phanspeed@asuramaya/metadata.json"
      man-pages: "src/data/man/man1/phanspeed.1 src/data/man/man8/phanspeedd.8"
      # run-smoke stays at its default (true): `make smoke` now runs
      # check-validation + check-signing, phanspeed's hardware-free
      # daemon/signing tests (new target, this migration -- see Makefile).
      # run-attack stays false (default): tests/attack_socket.py needs real
      # Dell hardware (dell-smm-hwmon + platform_profile), same exclusion
      # as before this migration -- run by maintainers on-device.
      # run-check-version / run-signing-verify stay false: phanspeed has no
      # check-version target (packaging/VERSION is the one constant,
      # check-repo's own rule enforces exactly that, same convention as
      # ramstein/byebyte); signing verification already runs inside
      # `make smoke` -- run-signing-verify would run it a second time.

  # Genuinely phanspeed-specific, per pill-ci.yml's own header ("stays as a
  # sibling job in the calling pill's own ci.yml"): the checkout-run
  # resolution guard across all three binaries that carry the bootstrap
  # preamble; ruff (no input exists for it in pill-ci.yml -- byebyte, the
  # adoption reference, doesn't use ruff at all, so this wasn't a gap
  # closed upstream, it's a genuine phanspeed-only need); verify-unit (no
  # family-wide systemd-unit check exists yet); and building the .deb
  # (kept in CI on every push, not just at tag time -- phanspeed's own
  # pre-existing practice, unrelated to this migration).
  phanspeed-specific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vendored-path resolution (all three sutra-importing binaries)
        run: make check-vendored-path-all

      - name: Ruff lint
        run: |
          python3 -m pip install --quiet ruff
          make lint-ruff

      - name: systemd unit verifies
        run: make verify-unit

      - name: Build .deb
        run: make check-deb
