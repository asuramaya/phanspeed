name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every step below runs a Makefile target and nothing else -- the
      # command itself lives in the Makefile, one place, so a step here and
      # `make check` locally can never silently disagree the way this
      # workflow's old hand-duplicated command lists did (found and ruled on
      # in PS-STD-1: five straight red CI runs, invisible to every "make
      # check green" gate report, because nobody had checked whether ci.yml's
      # own copy of each command still matched). Named steps stay, for a
      # readable Actions UI; only the target name is repo-specific.
      - name: sutra drift guard (integrity)
        run: make check-sutra

      - name: Python compiles
        run: make check-py

      - name: Config validation (fuzz, hardware-free)
        run: make check-validation

      - name: Release-signing tests
        run: make check-signing

      - name: Ruff lint
        run: |
          python3 -m pip install --quiet ruff
          make lint-ruff

      - name: Shellcheck
        run: make lint-shell

      - name: Shell scripts parse
        run: make check-shell-syntax

      - name: Extension JS syntax
        run: make check-js

      - name: metadata.json is valid
        run: make check-json

      - name: systemd unit verifies
        run: make verify-unit

      - name: man page (syntax)
        run: make check-man

      - name: Repo structure gate (REPO-STANDARD.md)
        # Before the deb build, deliberately: that step's own dist/ output is
        # gitignored but still a real root-level directory, and this gate
        # checks the checked-out repo's shape, not a post-build state.
        run: make check-repo

      - name: Build .deb
        run: make check-deb

# Note: tests/attack_socket.py requires real Dell hardware (dell-smm-hwmon +
# platform_profile) and is run by maintainers on-device, not in CI.
